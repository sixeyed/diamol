services:
  base:
    image: diamol/base:2e

  node:
    image: diamol/node:2e
    build:
      args:
        NODE_VERSION: ${NODE_VERSION}

  apache:
    image: diamol/apache:2e
    build:
      args:
        HTTPD_VERSION: ${HTTPD_VERSION}

  maven:
    image: diamol/maven:2e
    build:
      args:
        MAVEN_VERSION: ${MAVEN_VERSION}
        OPENJDK_DISTRO: ${OPENJDK_DISTRO}
        OPENJDK_VERSION: ${OPENJDK_VERSION}

  openjdk:
    image: diamol/openjdk:2e
    build:
      args:
        OPENJDK_DISTRO: ${OPENJDK_DISTRO}
        OPENJDK_VERSION: ${OPENJDK_VERSION}

  openjdk-jre:
    image: diamol/openjdk:2e-jre
    build:
      args:
        OPENJDK_DISTRO: ${OPENJDK_DISTRO}
        OPENJDK_VERSION: ${OPENJDK_VERSION}

  golang:
    image: diamol/golang:2e
    build:
      args:
        GOLANG_VERSION: ${GOLANG_VERSION}

  registry:
    image: diamol/registry:2e
    build:
      context: ../images/registry

  dotnet-runtime:
    image: diamol/dotnet-runtime:2e
    build:
      args:
        DOTNET_VERSION: ${DOTNET_VERSION}

  dotnet-sdk:
    image: diamol/dotnet-sdk:2e
    build:
      args:
        DOTNET_VERSION: ${DOTNET_VERSION}

  dotnet-aspnet:
    image: diamol/dotnet-aspnet:2e
    build:
      args:
        DOTNET_VERSION: ${DOTNET_VERSION}

  postgres-12:
    image: diamol/postgres:2e-12
    build:
      args:
        POSTGRES_VERSION: ${POSTGRES_12_VERSION}

  postgres-13:
    image: diamol/postgres:2e-13
    build:
      args:
        POSTGRES_VERSION: ${POSTGRES_13_VERSION}

  prometheus:
    image: diamol/prometheus:2e
    build:
      args:
        PROMETHEUS_VERSION: ${PROMETHEUS_VERSION}

  grafana:
    image: diamol/grafana:2e
    build:
      args:
        GRAFANA_VERSION: ${GRAFANA_VERSION}

  gogs:
    image: diamol/gogs:2e
    build:
      args:
        GOGS_VERSION: ${GOGS_VERSION}

  jenkins:
    image: diamol/jenkins:2e
    build:
      args:
        JENKINS_VERSION: ${JENKINS_VERSION}

  mssql:
    image: diamol/mssql:2e
    
  trivy:
    image: diamol/trivy:2e
    build:
      args:
        TRIVY_VERSION: ${TRIVY_VERSION}

  fluentd:
    image: diamol/fluentd:2e
    build:
      args:
        FLUENTD_VERSION: ${FLUENTD_VERSION}
        FLUENTD_RELEASE: ${FLUENTD_RELEASE}

  elasticsearch:
    image: diamol/elasticsearch:2e
    build:
      args:
        ELASTICSEARCH_VERSION: ${ELASTICSEARCH_VERSION}

  kibana:
    image: diamol/kibana:2e
    build:
      args:
        KIBANA_VERSION: ${KIBANA_VERSION}

  nginx:
    image: diamol/nginx:2e
    build:
      args:
        NGINX_VERSION: ${NGINX_VERSION}

  cert-generator:
    image: diamol/cert-generator:2e

  traefik:
    image: diamol/traefik:2e
    build:
      args:
        TRAEFIK_VERSION: ${TRAEFIK_VERSION}