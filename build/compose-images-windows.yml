services:
  windows-deps:
    image: diamol/windows-deps:2e-${DOCKER_BUILD_OS}${OS_VERSION_TAG}-${DOCKER_BUILD_CPU}
    build:
      context: ../images/windows-deps
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        GIT_WINDOWS_VERSION: ${GIT_WINDOWS_VERSION}
        GIT_WINDOWS_RELEASE_NUMBER: ${GIT_WINDOWS_RELEASE_NUMBER}
        GIT_WINDOWS_DOWNLOAD_SHA256: ${GIT_WINDOWS_DOWNLOAD_SHA256}

  base:
    build:
      context: ../images/base/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}

  node:
    build:
      context: ../images/node/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}

  apache:
    build:
      context: ../images/apache/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        HTTPD_BUILD: ${HTTPD_BUILD}

  maven:
    build:
      context: ../images/maven/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}

  openjdk:
    build:
      context: ../images/openjdk/windows

  openjdk-jre:
    build:
      context: ../images/openjdk/jre/windows

  golang:
    build:
      context: ../images/golang/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        GIT_VERSION: ${GIT_VERSION}
        GIT_WINDOWS_RELEASE_NUMBER: ${GIT_WINDOWS_RELEASE_NUMBER}
        GIT_WINDOWS_DOWNLOAD_SHA256: ${GIT_WINDOWS_DOWNLOAD_SHA256}

  dotnet-runtime:
    build:
      context: ../images/dotnet/runtime/windows
      args:
        WINDOWS_VERSION_CODE: ${WINDOWS_VERSION_CODE}

  dotnet-sdk:
    build:
      context: ../images/dotnet/sdk/windows
      args:
        WINDOWS_VERSION_CODE: ${WINDOWS_VERSION_CODE}

  dotnet-aspnet:
    build:
      context: ../images/dotnet/aspnet/windows
      args:
        WINDOWS_VERSION_CODE: ${WINDOWS_VERSION_CODE}

  postgres-12:
    build:
      context: ../images/postgres/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        ENTERPRISE_DB_DOWNLOAD_FILE_ID: ${ENTERPRISE_DB_12_DOWNLOAD_FILE_ID}

  postgres-13:
    build:
      context: ../images/postgres/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        ENTERPRISE_DB_DOWNLOAD_FILE_ID: ${ENTERPRISE_DB_13_DOWNLOAD_FILE_ID}

  prometheus:
    build:
      context: ../images/prometheus/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        PROMETHEUS_WINDOWS_DOWNLOAD_SHA256: ${PROMETHEUS_WINDOWS_DOWNLOAD_SHA256}

  grafana:
    build:
      context: ../images/grafana/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        GRAFANA_WINDOWS_DOWNLOAD_SHA256: ${GRAFANA_WINDOWS_DOWNLOAD_SHA256}

  gogs:
    build:
      context: ../images/gogs/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        GOGS_WINDOWS_DOWNLOAD_SHA256: ${GOGS_WINDOWS_DOWNLOAD_SHA256}

  jenkins:
    build:
      context: ../images/jenkins/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}

  mssql:
    build:
      context: ../images/mssql/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}
        MSSQL_DOWNLOAD_URL: ${MSSQL_DOWNLOAD_URL}
        MSSQL_VERSION_CODE: ${MSSQL_VERSION_CODE}
        MSSQL_INSTANCE_NAME: ${MSSQL_INSTANCE_NAME}
        SQLPACKAGE_DOWNLOAD_URL: ${SQLPACKAGE_WINDOWS_DOWNLOAD_URL}
  
  #TODO
  #trivy:
  #  build:
  #    context: ../images/trivy/windows

  fluentd:
    build:
      context: ../images/fluentd/windows
      args:
        WINDOWS_VERSION: ${WINDOWS_VERSION}

