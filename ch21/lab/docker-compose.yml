services:
  todo-web:
    image: diamol/ch21-todo-list:2e
    ports:
      - 8080:8080
    networks:
      - app-net

  todo-db:
    image: diamol/postgres:2e-12
    networks:
      - app-net

  message-queue:
    image: diamol/nats:2e
    ports:
      - "8222:8222"
    networks:
      - app-net

  save-handler:
    image: diamol/ch21-save-handler:2e
    environment:
      - Events__events.todo.itemsaved__Publish=true
    networks:
      - app-net

  todo-api:
    image: diamol/ch21-todo-api:2e
    ports:
      - 8081:8080
    networks:
      - app-net

  audit-handler:
    image: diamol/ch21-audit-handler:2e
    networks:
      - app-net

  mutating-handler:
    image: diamol/ch21-mutating-handler:2e
    environment:
      - MessageQueue__Url=nats://message-queue:4222
    networks:
      - app-net

networks:
  app-net:
