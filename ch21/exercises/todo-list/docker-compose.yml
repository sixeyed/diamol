services:
  todo-web:
    image: diamol/ch21-todo-list:2e
    ports:
      - 8080:8080
    networks:
      - app-net

  todo-db:
    image: diamol/postgres:2e-12
    networks:
      - app-net

  message-queue:
    image: diamol/nats:2e
    ports:
      - "8222:8222"
    networks:
      - app-net

  save-handler:
    image: diamol/ch21-save-handler:2e
    networks:
      - app-net

networks:
  app-net:
