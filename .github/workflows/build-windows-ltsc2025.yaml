name: build-windows-2025

on:
  push:
    branches:
      - "2e"
    paths:
      - ".github/workflows/build-windows-ltsc2025.yaml"
  workflow_dispatch:

jobs:
  define-matrices:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.generate.outputs.images }}
      chapters: ${{ steps.generate.outputs.chapters }}
    steps:
      - uses: actions/checkout@master
      - uses: ./.github/actions/generate-image-matrix
        id: generate
        with:
          os: windows

  build-images-windows-2025:
    runs-on: windows-2025
    needs: define-matrices
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.define-matrices.outputs.images) }}
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          filter: ${{ matrix.image }}