name: images-windows

on:
  push:
    branches:
      - "2e"
    paths:
      - ".github/workflows/build-images-windows.yaml"
  workflow_dispatch:
    inputs:
      filter:
        required: false
        default: ''
        description: "Image filter"

jobs:  
  images-windows-ltsc2019:
    runs-on: windows-2019
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          filter: "${{ github.event.inputs.filter }}"
  
  images-windows-ltsc2022:
    runs-on: windows-2022
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          filter: "${{ github.event.inputs.filter }}"
  
  images-windows-ltsc2025:
    runs-on: windows-2025
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          filter: "${{ github.event.inputs.filter }}"

  push-manifests:
    if: ${{ always() }}
    needs:
      - images-windows-ltsc2019
      - images-windows-ltsc2022
      - images-windows-ltsc2025
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/push-manifests
        with:
          filter: "${{ github.event.inputs.filter }}"