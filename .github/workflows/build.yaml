name: Build

on:
  push:
    branches:
      - "2e"
    paths:
      - "images/**"
      - "build/**"
      - ".github/workflows/build.yaml"

jobs:
  images-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Registry login    
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build

  chapters-linux-amd64:
    if: ${{ always() }}
    needs:
      - images-linux-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Registry login    
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          images: 'false'
          chapters: 'true'
  
  images-windows-ltsc2019:
    runs-on: windows-2019
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          filter: 'git-windows'
      - uses: ./.github/actions/build

  chapters-windows-ltsc2019:
    if: ${{ always() }}
    needs:
      - images-windows-ltsc2019
    runs-on: windows-2019
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          images: 'false'
          chapters: 'true'
  
  images-windows-ltsc2022:
    runs-on: windows-2022
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          filter: 'git-windows'
      - uses: ./.github/actions/build

  chapters-windows-ltsc2022:
    if: ${{ always() }}
    needs:
      - images-windows-ltsc2022
    runs-on: windows-2022
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          images: 'false'
          chapters: 'true'
  
  images-windows-ltsc2025:
    runs-on: windows-2025
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/build
        with:
          filter: 'git-windows'
      - uses: ./.github/actions/build
  
  chapters-windows-ltsc2025:
    if: ${{ always() }}
    needs:
      - images-windows-ltsc2025
    runs-on: windows-2025
    steps:
      - name: Docker Hub login
        shell: pwsh
        run: |
          docker login -u $env:USER -p $env:TOKEN
        env:
          USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - name: Build chapter images
        uses: ./.github/actions/build
        with:
          images: 'false'
          chapters: 'true'

  push-manifests:
    if: ${{ always() }}
    needs:
      - chapters-linux-amd64
      - chapters-windows-ltsc2019
      - chapters-windows-ltsc2022
      - chapters-windows-ltsc2025
    runs-on: ubuntu-latest
    steps:
      - name: Registry login    
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: actions/checkout@master
      - uses: ./.github/actions/push-manifests
      - uses: ./.github/actions/push-manifests
        with:
          images: 'false'
          chapters: 'true'